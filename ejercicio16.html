<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16 - Calculadora con Funciones Flecha</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
    
    <!-- Librería SweetAlert2 para mensajes de error -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/ejercicio16.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-calculador">
        <h1>Calculadora Básica</h1>

        <form class="calculador">
            <div class="formulario-calculador">
                <label for="numero1">Primer número:</label>
                <input type="text" id="numero1" placeholder="Ej. 10"><br>

                <label for="numero2">Segundo número:</label>
                <input type="text" id="numero2" placeholder="Ej. 5">
            </div>

            <div class="botones-operaciones">
                <button type="button" id="btn-sumar" class="boton-calcular">Sumar</button>
                <button type="button" id="btn-restar" class="boton-calcular">Restar</button>
                <button type="button" id="btn-multiplicar" class="boton-calcular">Multiplicar</button>
                <button type="button" id="btn-dividir" class="boton-calcular">Dividir</button>
            </div>

            <div class="formulario-calculador">
                <label for="resultado">Resultado:</label>
                <input type="text" id="resultado" readonly placeholder="Esperando operación...">
            </div>

            <div>
                <h3>Regresar al índice</h3>
                <a href="index.html">Índice</a>
            </div>
        </form>
    </div>
</body>
</html>
