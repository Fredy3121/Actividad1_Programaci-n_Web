<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion de KM a MM</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
    <script src="js/ejercicio11.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-conversor">
        <h1>Conversor de Kiometros a Millas</h1>
        <form class="conversion">
            <div class="formulario-conversion">
                <label for="kilometros">Kilometros</label>
                <input type="number" id="kilometros" placeholder="Ej. 10">
            </div>
            <button type="button" id="boton-convertir" class="boton-convertir">
                Convertir
            </button>
            <div class="formulario-conversor">
                <label for="resultado-millas">Resultado en millas</label>
                <input type="text" id="millas" readonly placeholder="Esperando conversion">
            </div>
            <div>
                <h3>Regresar al indice</h3>
                <a href="index.html"> Indice</a>
            </div>

        </form>
    </div>
</body>
</html>
