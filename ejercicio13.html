<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verficador de edad para votar</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
    <script src="js/ejercicio13.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-verificador">
        <h1>Verificador de edad para votar</h1>
        <form class="verificacion">
            <div class="formulario-verificador">
                <label for="edad">Ingrese su edad</label>
                <input type="number" id="edad" placeholder="Ej.18">
            </div>
            <button type="button" id="boton-verificar" class="boton-verificar">
                Verificar
            </button>
            <div class="formulario-verificador">
                <label for="resultado-verificar">Resultado si puedes votar</label>
                <input type="text" id="resultado-verificar" readonly placeholder="Esperando edad">
            </div>
            <div>
                <h3>Regresar al indice</h3>
                <a href="index.html"> Indice</a>
            </div>

        </form>
    </div>
</body>
</html>
